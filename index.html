function draw(){

const qo=$('qo');
function qClose(){qo.classList.remove('show');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
$('qs').onclick=()=>{qo.classList.add('show');if(qo.requestFullscreen)qo.requestFullscreen().catch(()=>{})};
